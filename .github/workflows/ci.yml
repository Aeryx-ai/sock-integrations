name: ci
on:
  push:
    branches: [main]
    # docs alone build nothing: no run for a doc update
    paths-ignore: ['.beads/**', 'docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['.beads/**', 'docs/**', '**/*.md']
# one run per ref: a newer push cancels the older run (Actions minutes are capped)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The Makefile and tests expect the CLI and MCP checkouts as siblings
      # named ../cli and ../mcp.
      - uses: actions/checkout@v4
        with:
          path: integrations
      - uses: actions/checkout@v4
        with:
          repository: Aeryx-ai/sock-cli
          path: cli
      - uses: actions/checkout@v4
        with:
          repository: Aeryx-ai/sock-mcp
          path: mcp
      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/test/go.mod
      - run: sudo apt-get install -y shellcheck jq
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: make check
        working-directory: integrations
